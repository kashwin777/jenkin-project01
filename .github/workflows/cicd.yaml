pipeline {
      agent any

          environment {
                    IMAGE = "dockerhubuser/myapp:${BUILD_NUMBER}"
                        }

                            stages {

                                      stage('Checkout') {
                                                    steps {
                                                                      git branch: 'main',
                                                                                        url: 'https://github.com/kashwin777/jenkin-project01.git',
                                                                                                          credentialsId: 'kashwin777'
                                                                                                                        }
                                                                                                                                }

                                                                                                                                        stage('Build') {
                                                                                                                                                      steps {
                                                                                                                                                                        sh 'mvn clean package'
                                                                                                                                                                                    }
                                                                                                                                                                                            }

                                                                                                                                                                                                    stage('Code Quality') {
                                                                                                                                                                                                                  steps {
                                                                                                                                                                                                                                    withSonarQubeEnv('sonarqube-server') {
                                                                                                                                                                                                                                                          sh 'mvn sonar:sonar'
                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                      stage('Docker Build') {
                                                                                                                                                                                                                                                                                                                    steps {
                                                                                                                                                                                                                                                                                                                                      sh "docker build -t ${kashwin777/testing-app-demo:4} ."
                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                  stage('Docker Push') {
                                                                                                                                                                                                                                                                                                                                                                                steps {
                                                                                                                                                                                                                                                                                                                                                                                                  withCredentials([usernamePassword(credentialsId: 'dockerhub-creds', usernameVariable: 'kashwin777', passwordVariable: 'Kashwin@22')]) {
                                                                                                                                                                                                                                                                                                                                                                                                                        sh '''
                                                                                                                                                                                                                                                                                                                                                                                                                                            echo $PASS | docker login -u $USER --password-stdin
                                                                                                                                                                                                                                                                                                                                                                                                                                                                docker push ${IMAGE}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    '''
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                stage('Deploy') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              steps {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                sh 'kubectl apply -f deployment.yaml'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }





                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    yaml file for cicd pipeline
                                                                                                                                                                                                                                                                                                                                                                                                  name: Java CI-CD Pipeline

                                                                                                                                                                                                                                                                                                                                                                                                  on:
                                                                                                                                                                                                                                                                                                                                                                                                      push:
                                                                                                                                                                                                                                                                                                                                                                                                            branches:
                                                                                                                                                                                                                                                                                                                                                                                                                    - main

                                                                                                                                                                                                                                                                                                                                                                                                                        pull_request:
                                                                                                                                                                                                                                                                                                                                                                                                                              branches:
                                                                                                                                                                                                                                                                                                                                                                                                                                      - main

                                                                                                                                                                                                                                                                                                                                                                                                                              env:
                                                                                                                                                                                                                                                                                                                                                                                                                                  IMAGE_NAME: dockerhubuser/testing-app-demo
                                                                                                                                                                                                                                                                                                                                                                                                                                      IMAGE_TAG: ${{ github.run_number }}

                                                                                                                                                                                                                                                                                                                                                                                                                                      jobs:

                                                                                                                                                                                                                                                                                                                                                                                                                                          checkout:
                                                                                                                                                                                                                                                                                                                                                                                                                                                name: Checkout Source Code
                                                                                                                                                                                                                                                                                                                                                                                                                                                      runs-on: ubuntu-latest

                                                                                                                                                                                                                                                                                                                                                                                                                                                            steps:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    - name: Checkout Repository
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              uses: actions/checkout@v4

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  build:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        name: Build Application
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              runs-on: ubuntu-latest
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    needs: checkout

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          steps:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  - name: Checkout Repository
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            uses: actions/checkout@v4

